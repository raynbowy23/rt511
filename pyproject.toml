[project]
name = "rt511"
version = "0.3.0"
description = "Offline pipeline for the rt511 camera wall: camera catalogs from agencies' published feeds, road graphs and the national index"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "shapely>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Ultralytics YOLO26 is AGPL-3.0, so it stays opt-in: `uv sync --extra detector`. Without it the detector is off and nothing else changes. Torch is only needed by the detector, so it lives here rather than in the core dependencies, which keeps the catalog and graph pipeline a small install.
detector = ["ultralytics>=8.4", "torch>=2.11.0"]

[project.scripts]
rt511 = "rt511.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rt511"]

[tool.ruff]
target-version = "py312"
# Lines are not wrapped at a column in this repository, so the limit is set past the longest line and only matters to import sorting.
line-length = 500

[tool.ruff.lint]
# Chosen explicitly so a ruff upgrade does not change what the gate checks. Pyflakes and the syntax errors, import order, bugbear, and modern-syntax upgrades for 3.12.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
