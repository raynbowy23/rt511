<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a4b5"/>
  </marker>
  <marker id="headWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541a"/>
  </marker>
</defs>
<rect width="900" height="380" fill="#ffffff"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1d2530">Process 4. Zero-motion gate. The one question the arithmetic cannot answer</text>
<rect x="28" y="74" width="200" height="76" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="128" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">This poll</text>
<text x="128" y="116" text-anchor="middle" font-size="12" fill="#5d6b7d">frame difference</text>
<text x="128" y="133" text-anchor="middle" font-size="12" fill="#5d6b7d">and the cell it fell in</text>
<path d="M 228 112 L 300 112" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<polygon points="410,70 520,112 410,154 300,112" fill="#fff6ec" stroke="#b4541a"/>
<text x="410" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2530">diff &lt;= floor ?</text>
<path d="M 520 112 L 592 112" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="556" y="105" text-anchor="middle" font-size="11.5" fill="#5d6b7d">yes</text>
<polygon points="712,70 820,112 712,154 604,112" fill="#fff6ec" stroke="#b4541a"/>
<text x="712" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2530">hour moves ?</text>
<path d="M 410 154 L 410 226" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="420" y="183" text-anchor="start" font-size="11.5" fill="#5d6b7d">no</text>
<path d="M 712 154 L 712 226" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="722" y="183" text-anchor="start" font-size="11.5" fill="#5d6b7d">no</text>
<rect x="300" y="226" width="220" height="66" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="410" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Ordinary poll</text>
<text x="410" y="268" text-anchor="middle" font-size="12" fill="#5d6b7d">scored on its own terms</text>
<rect x="602" y="226" width="220" height="66" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="712" y="251" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Ordinary poll</text>
<text x="712" y="268" text-anchor="middle" font-size="12" fill="#5d6b7d">a quiet hour is allowed</text>
<path d="M 820 112 L 872 112 L 872 322 L 520 322" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="845" y="104" text-anchor="middle" font-size="11.5" fill="#5d6b7d">yes</text>
<rect x="190" y="300" width="330" height="46" rx="7" fill="#fff6ec" stroke="#b4541a"/>
<text x="355" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">AMBIGUOUS_ZERO recorded, then asked about</text>
<text x="28" y="366" text-anchor="start" font-size="12" fill="#5d6b7d">The cell must hold at least 5 frames and average more than 0.008 before it is allowed to expect anything, or the flag</text>
<text x="28" y="382" text-anchor="start" font-size="12" fill="#5d6b7d">measures how new the profile is rather than anything about the road.</text>
</svg>
