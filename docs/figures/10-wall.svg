<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a4b5"/>
  </marker>
  <marker id="headWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541a"/>
  </marker>
</defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1d2530">Process 10. The wall. A ranking, a fixed number of tiles, and hysteresis to keep them still</text>
<rect x="28" y="70" width="210" height="80" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="133" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Every scored camera</text>
<text x="133" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">attention in 0..1</text>
<path d="M 238 110 L 306 110" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="272" y="103" text-anchor="middle" font-size="11.5" fill="#5d6b7d">sort</text>
<rect x="306" y="70" width="200" height="80" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="406" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Ranking</text>
<text x="406" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">top 30 written to the log</text>
<path d="M 506 110 L 574 110" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="574" y="70" width="298" height="80" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="723" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Tiles</text>
<text x="723" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">size follows attention</text>
<text x="723" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">filterable by state and city</text>
<path d="M 406 150 L 406 196" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="276" y="196" width="260" height="62" rx="7" fill="#f4f7fa" stroke="#1f6feb"/>
<text x="406" y="221" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Four-rank hysteresis</text>
<text x="406" y="238" text-anchor="middle" font-size="12" fill="#5d6b7d">a tile holds until clearly beaten</text>
<text x="28" y="292" text-anchor="start" font-size="12" fill="#5d6b7d">Without hysteresis, cameras sitting either side of the cut swap places on noise alone, and the wall flickers. A tile</text>
<text x="28" y="308" text-anchor="start" font-size="12" fill="#5d6b7d">has to be beaten by four ranks before it gives up its place.</text>
</svg>
