<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a4b5"/>
  </marker>
  <marker id="headWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541a"/>
  </marker>
</defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1d2530">Process 9. Corridor. Upstream candidates from the directed graph rather than from a radius</text>
<line x1="60" y1="150" x2="840" y2="150" stroke="#96a4b5" stroke-width="2"/>
<circle cx="110" cy="150" r="9" fill="#ffffff" stroke="#96a4b5" stroke-width="2"/>
<text x="110" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530">C-3</text>
<text x="110" y="176" text-anchor="middle" font-size="11.5" fill="#5d6b7d">3 hops</text>
<circle cx="280" cy="150" r="9" fill="#ffffff" stroke="#96a4b5" stroke-width="2"/>
<text x="280" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530">C-2</text>
<text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#5d6b7d">2 hops</text>
<circle cx="450" cy="150" r="9" fill="#ffffff" stroke="#96a4b5" stroke-width="2"/>
<text x="450" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530">C-1</text>
<text x="450" y="176" text-anchor="middle" font-size="11.5" fill="#5d6b7d">1 hop</text>
<circle cx="640" cy="150" r="9" fill="#b4541a" stroke="#b4541a" stroke-width="2"/>
<text x="640" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530">incident</text>
<text x="640" y="176" text-anchor="middle" font-size="11.5" fill="#5d6b7d"></text>
<circle cx="800" cy="150" r="9" fill="#ffffff" stroke="#96a4b5" stroke-width="2"/>
<text x="800" y="130" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530">C+1</text>
<text x="800" y="176" text-anchor="middle" font-size="11.5" fill="#5d6b7d">downstream</text>
<text x="360" y="108" text-anchor="middle" font-size="12" fill="#5d6b7d">traffic travels this way</text>
<path d="M 200 96 L 560 96" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="360" y="222" text-anchor="middle" font-size="12" fill="#b4541a">the queue tail travels this way, at 15 km/h</text>
<path d="M 560 210 L 200 210" fill="none" stroke="#b4541a" stroke-width="1.6" marker-end="url(#headWarm)"/>
<rect x="28" y="250" width="400" height="76" rx="7" fill="#f4f7fa" stroke="#1f6feb"/>
<text x="228" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Candidate set</text>
<text x="228" y="292" text-anchor="middle" font-size="12" fill="#5d6b7d">up to 3 hops and 5 km of road</text>
<text x="228" y="309" text-anchor="middle" font-size="12" fill="#5d6b7d">offered to the choice, 4 at a time</text>
<rect x="456" y="250" width="416" height="76" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="664" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">What each candidate carries</text>
<text x="664" y="292" text-anchor="middle" font-size="12" fill="#5d6b7d">road distance, driving time, hops</text>
<text x="664" y="309" text-anchor="middle" font-size="12" fill="#5d6b7d">pictures and when a tail would reach it</text>
</svg>
