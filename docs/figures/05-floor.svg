<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a4b5"/>
  </marker>
  <marker id="headWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541a"/>
  </marker>
</defs>
<rect width="900" height="384" fill="#ffffff"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1d2530">Process 5. Incident floor. A dispatch record as a lower bound rather than another weight</text>
<rect x="28" y="70" width="200" height="88" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="128" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Dispatch record</text>
<text x="128" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">agency code</text>
<text x="128" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">location and time</text>
<path d="M 228 114 L 296 114" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="296" y="70" width="174" height="88" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="383" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Code level</text>
<text x="383" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">closure 0.9</text>
<text x="383" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">road-relevant 0.6</text>
<text x="383" y="146" text-anchor="middle" font-size="12" fill="#5d6b7d">otherwise 0</text>
<path d="M 470 114 L 528 114" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="499" y="107" text-anchor="middle" font-size="11.5" fill="#5d6b7d">x</text>
<rect x="528" y="70" width="156" height="88" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="606" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Distance taper</text>
<text x="606" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">1 within 0.25 km</text>
<text x="606" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">0.25 at the edge</text>
<path d="M 684 114 L 742 114" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="713" y="107" text-anchor="middle" font-size="11.5" fill="#5d6b7d">x</text>
<rect x="742" y="70" width="130" height="88" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="807" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Age</text>
<text x="807" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">full for 60 min</text>
<text x="807" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">then half-life 30 min</text>
<text x="450" y="202" text-anchor="middle" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d2530">Floor = level(code) * taper(distance) * 0.5 ^ (max(0, age - 60 min) / 30 min)</text>
<path d="M 450 216 L 450 252" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="240" y="252" width="420" height="50" rx="7" fill="#f4f7fa" stroke="#1f6feb"/>
<text x="450" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">The floor under every camera the record names</text>
<text x="28" y="340" text-anchor="start" font-size="12" fill="#5d6b7d">A feed lists a record only while it is open, so the record keeps its full floor for its first hour. After that it</text>
<text x="28" y="356" text-anchor="start" font-size="12" fill="#5d6b7d">halves every half hour, so a record a dispatcher</text>
<text x="28" y="372" text-anchor="start" font-size="12" fill="#5d6b7d">leaves open for days does not hold a camera on the wall for days. One record in an earlier dispatch feed had been open</text>
<text x="28" y="388" text-anchor="start" font-size="12" fill="#5d6b7d">for 171 days.</text>
</svg>
