<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a4b5"/>
  </marker>
  <marker id="headWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541a"/>
  </marker>
</defs>
<rect width="900" height="350" fill="#ffffff"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1d2530">Process 1. Polling. No faster than an agency makes pictures, and within a budget per agency</text>
<rect x="28" y="70" width="190" height="80" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="123" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Agency image host</text>
<text x="123" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">5 agency feeds, 7 states</text>
<text x="123" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">one JPEG per camera</text>
<path d="M 218 110 L 300 110" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="259" y="103" text-anchor="middle" font-size="11.5" fill="#5d6b7d">HTTP GET</text>
<rect x="300" y="70" width="200" height="80" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="400" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Per-source client</text>
<text x="400" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">If-Modified-Since</text>
<text x="400" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">rate cap per agency</text>
<path d="M 500 110 L 582 110" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="526" y="96" text-anchor="middle" font-size="11.5" fill="#5d6b7d">fresh, 304, gone</text>
<rect x="582" y="70" width="290" height="80" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="727" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Camera slot</text>
<text x="727" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">newest frame plus 24 differences</text>
<text x="727" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">10 frames kept for replay</text>
<path d="M 727 150 L 727 196" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="582" y="196" width="290" height="94" rx="7" fill="#f4f7fa" stroke="#1f6feb"/>
<text x="727" y="221" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Next poll time</text>
<text x="727" y="238" text-anchor="middle" font-size="12" fill="#5d6b7d">fresh: Last-Modified + period + 4 s</text>
<text x="727" y="255" text-anchor="middle" font-size="12" fill="#5d6b7d">stale or 304: one full period</text>
<path d="M 582 234 L 420 234" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="491" y="227" text-anchor="middle" font-size="11.5" fill="#5d6b7d">schedule</text>
<rect x="180" y="196" width="240" height="94" rx="7" fill="#f4f7fa" stroke="#1f6feb"/>
<text x="300" y="221" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Budget per agency</text>
<text x="300" y="238" text-anchor="middle" font-size="12" fill="#5d6b7d">on screen: 1 per 5 s</text>
<text x="300" y="255" text-anchor="middle" font-size="12" fill="#5d6b7d">off screen: 1 per 10 s, each &gt;= 10 min</text>
<path d="M 180 234 L 130 234 L 130 150" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="28" y="322" text-anchor="start" font-size="12" fill="#5d6b7d">A fresh picture times the next request to the next one. A picture that has stopped changing is asked about once a</text>
<text x="28" y="338" text-anchor="start" font-size="12" fill="#5d6b7d">period. The camera open in the panel sits outside the budget.</text>
</svg>
