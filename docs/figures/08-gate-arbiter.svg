<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a4b5"/>
  </marker>
  <marker id="headWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541a"/>
  </marker>
</defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1d2530">Process 8. Gate arbitration. Telling stopped traffic from an empty road and a dead picture</text>
<rect x="28" y="74" width="210" height="80" rx="7" fill="#f4f7fa" stroke="#b4541a"/>
<text x="133" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">A flagged camera</text>
<text x="133" y="116" text-anchor="middle" font-size="12" fill="#5d6b7d">still, in an hour that moves</text>
<path d="M 238 114 L 312 114" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="275" y="107" text-anchor="middle" font-size="11.5" fill="#5d6b7d">state</text>
<rect x="312" y="74" width="190" height="80" rx="7" fill="#f4f7fa" stroke="#1f6feb"/>
<text x="407" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Jev, one call</text>
<text x="407" y="116" text-anchor="middle" font-size="12" fill="#5d6b7d">two nouls</text>
<path d="M 502 96 L 576 96" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M 502 132 L 576 132" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="576" y="66" width="296" height="46" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="724" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">frozen: the feed has stopped</text>
<rect x="576" y="124" width="296" height="46" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="724" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">standstill: traffic has stopped</text>
<path d="M 724 170 L 724 208" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<polygon points="724,209 849,240 724,271 599,240" fill="#fff6ec" stroke="#b4541a"/>
<text x="724" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2530">frozen confident ?</text>
<path d="M 724 271 L 724 306" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="734" y="281.5" text-anchor="start" font-size="11.5" fill="#5d6b7d">no</text>
<path d="M 599 240 L 500 240" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="550" y="232" text-anchor="middle" font-size="11.5" fill="#5d6b7d">yes</text>
<rect x="576" y="306" width="296" height="48" rx="7" fill="#f4f7fa" stroke="#1f6feb"/>
<text x="724" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Floor of 0.6, held 10 min</text>
<rect x="200" y="216" width="300" height="48" rx="7" fill="#f4f7fa" stroke="#96a4b5" stroke-dasharray="5 4"/>
<text x="350" y="245" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Nothing, and the standstill answer with it</text>
<text x="28" y="196" text-anchor="start" font-size="12" fill="#5d6b7d">At most 3 cameras per pass,</text>
<text x="28" y="212" text-anchor="start" font-size="12" fill="#5d6b7d">and one camera at most every 5 minutes.</text>
</svg>
