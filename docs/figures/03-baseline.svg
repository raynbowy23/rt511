<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="900" height="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a4b5"/>
  </marker>
  <marker id="headWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541a"/>
  </marker>
</defs>
<rect width="900" height="382" fill="#ffffff"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1d2530">Process 3. Baseline. What this camera usually does at this hour, usable from the first poll</text>
<rect x="28" y="70" width="250" height="92" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="153" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Hour-of-week cell</text>
<text x="153" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">168 cells, day x hour</text>
<text x="153" y="129" text-anchor="middle" font-size="12" fill="#5d6b7d">running mean and count N</text>
<rect x="28" y="186" width="250" height="84" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="153" y="211" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Rolling median</text>
<text x="153" y="228" text-anchor="middle" font-size="12" fill="#5d6b7d">median of the last 24 differences</text>
<text x="153" y="245" text-anchor="middle" font-size="12" fill="#5d6b7d">available immediately</text>
<path d="M 278 116 L 372 150" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="325" y="126" text-anchor="middle" font-size="11.5" fill="#5d6b7d">weight N/(N+K)</text>
<path d="M 278 228 L 372 194" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<text x="325" y="204" text-anchor="middle" font-size="11.5" fill="#5d6b7d">weight K/(N+K)</text>
<rect x="372" y="130" width="230" height="84" rx="7" fill="#f4f7fa" stroke="#1f6feb"/>
<text x="487" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Shrinkage blend</text>
<text x="487" y="172" text-anchor="middle" font-size="12" fill="#5d6b7d">K = 5</text>
<path d="M 602 172 L 676 172" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="676" y="130" width="196" height="84" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="774" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Baseline mu</text>
<text x="774" y="172" text-anchor="middle" font-size="12" fill="#5d6b7d">what anomaly divides by</text>
<text x="450" y="304" text-anchor="middle" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d2530">mu = (N/(N+K)) * cellMean + (K/(N+K)) * rollingMedian</text>
<text x="28" y="340" text-anchor="start" font-size="12" fill="#5d6b7d">At N = 0 the blend returns the rolling median exactly, so the system is usable at once. A picture at least 2 times</text>
<text x="28" y="356" text-anchor="start" font-size="12" fill="#5d6b7d">what the cell expects, or a stillness it does not expect, is not folded in,</text>
<text x="28" y="372" text-anchor="start" font-size="12" fill="#5d6b7d">so an ongoing event does not become the usual. An unusual level lasting 3 hours is accepted as the new usual.</text>
</svg>
