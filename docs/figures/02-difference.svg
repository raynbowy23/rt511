<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a4b5"/>
  </marker>
  <marker id="headWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4541a"/>
  </marker>
</defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1d2530">Process 2. Frame difference. The only number computed on every frame of every camera</text>
<rect x="28" y="70" width="170" height="74" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="113" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Frame at t</text>
<text x="113" y="112" text-anchor="middle" font-size="12" fill="#5d6b7d">full-size JPEG</text>
<rect x="28" y="160" width="170" height="74" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="113" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Frame at t-1</text>
<text x="113" y="202" text-anchor="middle" font-size="12" fill="#5d6b7d">the one before it</text>
<path d="M 198 107 L 268 130" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<path d="M 198 197 L 268 174" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="268" y="112" width="200" height="80" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="368" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Downscale to 64 x 48</text>
<text x="368" y="154" text-anchor="middle" font-size="12" fill="#5d6b7d">grayscale</text>
<text x="368" y="171" text-anchor="middle" font-size="12" fill="#5d6b7d">one thumbnail per frame</text>
<path d="M 468 152 L 540 152" fill="none" stroke="#96a4b5" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="540" y="112" width="330" height="80" rx="7" fill="#f4f7fa" stroke="#96a4b5"/>
<text x="705" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2530">Mean absolute difference</text>
<text x="705" y="154" text-anchor="middle" font-size="12" fill="#5d6b7d">one scalar in 0..1</text>
<text x="705" y="232" text-anchor="middle" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d2530">diff = (1/WH) * SUM |I_t(x,y) - I_t-1(x,y)|</text>
<text x="28" y="262" text-anchor="start" font-size="12" fill="#5d6b7d">A camera returning its first frame has no difference at all. Identical bytes are not a difference of zero. They are</text>
<text x="28" y="278" text-anchor="start" font-size="12" fill="#5d6b7d">recorded as unchanged and never folded into a baseline.</text>
</svg>
